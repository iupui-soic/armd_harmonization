# Benchmark task registry (plan section 4.5).
# Each task pins its cohort, label constructor, feature set, split manifest and metrics.
# Label constructors live in armd_common.labels. The feature set name refers to
# armd_common.features.FEATURES_48. Decided on 2026-09-27: tasks use the chained 14-day repeat rule and
# one row per specimen-day (docs/HARMONIZATION.md, Repeat cultures and the unit of analysis).

version: 1

# Decided on 2026-09-11: every task uses all 48 harmonized features, cross-site pairs included, and
# MGB uses the lab interpretation (CLSI 2022 is a sensitivity analysis).
# Decided on 2026-11-03: MGB means ARMD-MGB 2.0.0, site key mgb2. The 1.0.0 site key mgb is kept
# for reproducing earlier results only.
defaults:
  seed: 20260911
  repeat_rule: chained_14d
  unit: specimen_day
  split_manifest: benchmarks/manifests/{site}.csv.gz
  features: harmonized48
  interpretation: lab
  sir_column: sir
  metrics:
    - auroc
    - auprc
    - calibration_intercept
    - calibration_slope
    - brier
    - sensitivity_at_90_sensitivity
    - specificity_at_90_sensitivity
    - ppv_at_90_sensitivity
    - npv_at_90_sensitivity
    - net_benefit
  net_benefit_thresholds: [0.05, 0.10, 0.15, 0.20]
  bootstrap:
    iterations: 2000
    resample: patient

tasks:
  esbl_composite_e1:
    description: Status quo estimand. Cultures that grew Enterobacterales and had at least one sentinel agent reported.
    estimand: E1
    sites: [stanford, mgb2, utsw, ecuh]
    label:
      constructor: esbl_phenotype_composite
      agents: [CRO, CAZ, FEP, TZP]
      nonsusceptible: false
    cohort: evaluable

  esbl_composite_e2:
    description: Decision-time estimand. Every ordered culture. Negative and non-Enterobacterales cultures are Y = 0.
    estimand: E2
    sites: [stanford, mgb2, utsw, ecuh]
    label:
      constructor: esbl_decision_time
      agents: [CRO, CAZ, FEP, TZP]
      nonsusceptible: false
    cohort: evaluable

  esbl_idsa_strict:
    description: Ceftriaxone non-susceptible E. coli, K. pneumoniae, K. oxytoca or P. mirabilis.
    estimand: E1
    sites: [stanford, mgb2, utsw, ecuh]
    label:
      constructor: esbl_phenotype_idsa
      nonsusceptible: true
    cohort: evaluable

  esbl_crossite_e1:
    description: Train on one site and test on another, for every ordered pair, under the E1 composite label.
    estimand: E1
    pairs: all_ordered
    sites: [stanford, mgb2, utsw, ecuh]
    label:
      constructor: esbl_phenotype_composite
      agents: [CRO, CAZ, FEP, TZP]
      nonsusceptible: false
    cohort: evaluable
    train_partition: derivation
    test_partition: test
