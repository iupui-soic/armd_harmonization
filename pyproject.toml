[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armd-common"
version = "0.1.0"
description = "Harmonization layer and leakage-safe benchmark for the ARMD family of EHR-derived antimicrobial resistance datasets"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "polars>=1.0",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
model = ["xgboost>=2.1", "scikit-learn>=1.5", "statsmodels>=0.14"]
figures = ["matplotlib>=3.9"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armd_common = ["*.yaml", "mappings/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
