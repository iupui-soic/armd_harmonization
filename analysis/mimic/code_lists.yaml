# ------------------------------------------------------------------------------------------------
# B. Charlson comorbidities, Quan 2005 Table 1: 17 categories.
#   Transcribed from [C]. weight is the original Charlson 1987 weight (Charlson ME, Pompei P,
#   Ales KL, MacKenzie CR. J Chronic Dis 1987;40:373-83). It equals the "charlson" weight set in
#   [C], and [M] scores with the same weights.
#   Cross-check: the ICD-10 lists are identical to [S]. The ICD-9 lists differ from [S] only as for
#   Elixhauser, by extra [C] prefixes that match no ICD-9-CM code. [M] uses the same codes, with
#   one exception noted under any_malignancy.
#   WHO ICD-10 versus ICD-10-CM: as for Elixhauser above.
#   Hierarchy rules, NOT applied in this file. Apply them when scoring, as [C] (assign0 = TRUE)
#   and [M] do:
#     - mild_liver_disease counts 0 when moderate_or_severe_liver_disease is present.
#     - diabetes_without_chronic_complication counts 0 when diabetes_with_chronic_complication is
#       present.
#     - any_malignancy counts 0 when metastatic_solid_tumor is present.
charlson_quan2005:
  myocardial_infarction:  # Myocardial infarction. [C] key: mi
    icd9: ["410", "412"]
    icd10: ["I21", "I22", "I252"]
    weight: 1
  # ICD-9 entry 4256 is in [C] but not in [S]. It matches no ICD-9-CM code in [K].
