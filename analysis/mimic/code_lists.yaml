# ICD code lists for the MIMIC-IV 3.1 analysis.
#
# A script transcribed every list from the machine-readable sources below and checked each entry
# against official code sets. No list was typed from memory.
#
# MATCHING RULE
#   Entries are dotless prefixes, because MIMIC-IV 3.1 stores icd_code without dots. A code
#   matches an entry when the code starts with the entry. Apply icd9 lists only to rows with
#   icd_version 9, and icd10 or icd10pcs lists only to rows with icd_version 10. The diagnosis
#   lists (elixhauser_quan2005, charlson_quan2005, heart_failure_ccsr) apply to diagnoses_icd. The
#   procedures lists apply to procedures_icd. ICD-9-CM procedure entries assume that codes keep
#   their leading zero ("0131", not "131").
#   [C] and [S] below use the same prefix rule, so these lists flag the same codes they do.
#
# SOURCES (all retrieved 2026-10-29)
#   [Q] Quan H, Sundararajan V, Halfon P, et al. Coding algorithms for defining comorbidities in
#       ICD-9-CM and ICD-10 administrative data. Med Care 2005;43(11):1130-9. Table 1 (Charlson)
#       and Table 2 (Elixhauser), columns "Enhanced ICD-9-CM" and "ICD-10". The paper itself was
#       not read for this file. [C] and [S] are its machine-readable versions, and they agree.
#   [C] R package comorbidity 1.1.0 by A. Gasparini (CRAN release 2024-07-16). This file follows
#       [C]. Source data-raw/make-mapping.R at git tag 1.1.0, commit
#       0785f506dfff07be77566a2ce9163403b36dfd67, identical on master at
#       8f5f79d379c3198b807e824b0f2d703688818fda.
#       https://raw.githubusercontent.com/ellessenne/comorbidity/0785f506dfff07be77566a2ce9163403b36dfd67/data-raw/make-mapping.R
#       sha256 416fde64064b3a3999180f8c8f08e73c73febbff765c377b32bf2f4155124421
#       Maps used: elixhauser_icd9_quan, elixhauser_icd10_quan, charlson_icd9_quan and
#       charlson_icd10_quan. Charlson weights come from data-raw/make-weights.R at the same
#       commit, weight set "charlson" (original 1987 weights).
#   [S] SAS programs headed with the Quan 2005 citation, as redistributed in the R package icd
#       (github jackwasey/icd, version 4.0.9.9000, commit 124d824a1b06cb73fb0dbfd1ef6e3c4a666dc9d0):
#       data-raw/ICD9_E_Elixhauser.sas, ICD10_Elixhauser.sas, ICD9_E_Charlson.sas and
#       ICD10_Charlson.sas. Used as a cross-check only.
#   [M] MIT-LCP/mimic-code commit 303d26c623dcc9c49cc0f204468d4acc2f063797,
#       mimic-iv/concepts/comorbidity/charlson.sql. Used as a cross-check only.
#   [H] HCUP Clinical Classifications Software Refined (CCSR) for ICD-10-CM diagnoses, v2026.1,
#       file DXCCSR_v2026-1.csv in https://hcup-us.ahrq.gov/toolssoftware/ccsr/DXCCSR-v2026-1.zip
#       (zip sha256 093ea8f925606eea74a9342395eed440e7635293d0abf031d8c89d1183cde310).
#       Also serves as the ICD-10-CM code set for the match checks (75,725 codes).
#   [P] HCUP CCSR for ICD-10-PCS procedures, v2026.1, file PRCCSR_v2026-1.csv in
#       https://hcup-us.ahrq.gov/toolssoftware/ccsr/PRCCSR_v2026-1.zip
#       (zip sha256 b6537c78874bf11071a4f83b801fbb8a1f9a01dd377e45d40f69c0295791729d).
#       Also serves as the ICD-10-PCS code set (82,327 codes, including some retired codes).
#   [K] HCUP single-level CCS for ICD-9-CM, final 2015 release, files "$dxref 2015.csv" and
#       "$prref 2015.csv" in https://hcup-us.ahrq.gov/toolssoftware/ccs/Single_Level_CCS_2015.zip
#       (zip sha256 a1e31709cc4fa7d67fc254a7421ec9686030098af9225d5f7ba73ae28deaa283).
#       Also serves as the ICD-9-CM code sets (15,072 diagnosis and 3,948 procedure codes).
#   [G] CMS 2018 General Equivalence Mappings (GEMs). Diagnoses: 2018_I10gem.txt and
#       2018_I9gem.txt in
#       https://www.cms.gov/Medicare/Coding/ICD10/Downloads/2018-ICD-10-CM-General-Equivalence-Mappings.zip
#       (zip sha256 1c5e5f14026ace48437a0d1c485d282fb5d171c357c6ab4f7798fc0a1e3624a2).
#       Procedures: gem_i9pcs.txt and gem_pcsi9.txt in
#       https://www.cms.gov/Medicare/Coding/ICD10/Downloads/2018-ICD-10-PCS-General-Equivalence-Mappings.zip
#       (zip sha256 7410a56e04411030739bfa2d300ce7e42ea23e8f9281c45d04dc4d6c678f9db0).

# ------------------------------------------------------------------------------------------------
# A. Elixhauser comorbidities, Quan 2005 Table 2: 31 categories.
#   Transcribed from [C]. Category names follow [Q] in snake_case. The comment after each name
#   gives the [Q] label and the [C] key.
#   Cross-check against [S]: the ICD-10 lists are identical. For ICD-9, [C] has a few extra
#   prefixes that [S] lacks, which look like ranges such as 425.4-425.9 expanded digit by digit.
#   None of them matches an ICD-9-CM code in [K], so [C] and [S] flag the same codes. Each case is
#   noted above its category.
#   ICD-10 here is WHO ICD-10, as in [Q], not ICD-10-CM. Entries with no ICD-10-CM counterpart are
#   kept for fidelity and noted. They never match. ICD-10-CM codes with no WHO counterpart are
#   NOT covered, for example E08 and E09 (diabetes due to an underlying condition or to a drug),
#   C4A, C7A and C7B (Merkel cell and neuroendocrine tumours) and Z49.3 (dialysis adequacy
#   encounters).
#   Overlaps are part of [Q]. For example F31.5 is in both psychoses and depression, and K70.0,
#   K70.3 and K70.9 are in both liver_disease and alcohol_abuse.
#   Hierarchy, NOT applied in this file: [C] with assign0 = TRUE zeroes
#   hypertension_uncomplicated when hypertension_complicated is present, diabetes_uncomplicated
#   when diabetes_complicated is present, and solid_tumor_without_metastasis when
#   metastatic_cancer is present.
